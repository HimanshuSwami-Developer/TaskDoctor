<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Doctor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { body: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="min-h-screen bg-slate-50 font-body text-slate-800 antialiased">
  <div id="progress" class="progress" role="progressbar" aria-label="Loading"></div>

  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-[1400px] flex-wrap items-center gap-4 px-6 pt-4">
      <h1 class="text-lg font-semibold text-slate-900">Task Doctor</h1>
      <div id="products" class="flex flex-wrap items-center gap-1.5 border-l border-slate-200 pl-4">
        <span class="skeleton h-7 w-24"></span><span class="skeleton h-7 w-20"></span>
      </div>
      <div id="summary" class="ml-auto flex flex-wrap gap-2">
        <span class="skeleton h-7 w-24"></span><span class="skeleton h-7 w-24"></span><span class="skeleton h-7 w-24"></span>
      </div>
      <div id="account" class="flex items-center gap-2"></div>
    </div>
    <nav id="tabs" class="mx-auto flex max-w-[1400px] flex-wrap items-end gap-1 px-6 pt-3"></nav>
  </header>

  <main id="board" class="mx-auto max-w-[1400px] px-6 py-6">
    <div aria-busy="true" aria-label="Loading">
      <div class="mb-6 flex items-center gap-4"><div class="skeleton h-8 w-48"></div><div class="skeleton h-2 w-40"></div></div>
      <div class="skeleton mb-3 h-5 w-32"></div>
      <div class="flex gap-11 overflow-hidden">
        <div class="skeleton h-[380px] w-[290px] shrink-0"></div>
        <div class="skeleton h-[380px] w-[290px] shrink-0"></div>
        <div class="skeleton h-[380px] w-[290px] shrink-0"></div>
        <div class="skeleton h-[380px] w-[290px] shrink-0"></div>
      </div>
    </div>
  </main>

  <div id="popup" class="overlay hidden">
    <div class="popup-card"><div id="popupBody"></div></div>
  </div>

  <div id="login" class="login hidden">
    <form id="loginForm" class="dialog-card p-6" autocomplete="on">
      <h2 class="text-lg font-semibold text-slate-900">Task Doctor</h2>
      <p class="mt-1 text-sm text-slate-500">Sign in with the login your admin gave you.</p>
      <label class="mt-5 block"><span class="field-label">Username</span>
        <input class="input w-full" name="username" autocomplete="username" required></label>
      <label class="mt-3 block"><span class="field-label">Password</span>
        <input class="input w-full" type="password" name="password" autocomplete="current-password" required></label>
      <p class="dialog-error mt-3 hidden"></p>
      <button class="btn-primary mt-5 w-full justify-center">Sign in</button>
    </form>
  </div>

  <div id="videoModal" class="overlay hidden">
    <div id="videoBody" class="popup-card max-w-4xl overflow-hidden"></div>
  </div>

  <div id="writerModal" class="overlay hidden">
    <form id="writerForm" class="popup-card max-w-lg" novalidate></form>
  </div>

  <div id="adminModal" class="overlay hidden">
    <div id="adminBody" class="popup-card max-w-4xl"></div>
  </div>

  <div id="bugsModal" class="overlay hidden">
    <div id="bugsBody" class="popup-card"></div>
  </div>

  <div id="statusModal" class="overlay hidden">
    <div id="statusBody" class="popup-card max-w-md"></div>
  </div>

  <div id="copyModal" class="overlay hidden">
    <form id="copyForm" class="popup-card max-w-md"></form>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-card" id="sheetBody"></div>
  </div>

  <div id="dialog" class="dialog-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <form id="dialogForm" class="dialog-card" novalidate></form>
  </div>

  <datalist id="people"></datalist>
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
